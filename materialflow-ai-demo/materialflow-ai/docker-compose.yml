name: materialflow-ai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-materialflow}
      POSTGRES_USER: ${POSTGRES_USER:-materialflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-materialflow}
      POSTGRES_USER: ${POSTGRES_USER:-materialflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    # Publicada apenas em localhost. Em produção, coloque um proxy HTTPS à frente.
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  pgdata:
  storage:
